apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        if [ -d "$(workspaces.source.path)" ]; then
          find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-tests
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install -r requirements.txt
        nosetests -v --with-spec --spec-color
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE
      type: string
  steps:
    - name: build
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        oc start-build ci-cd-final-project --from-dir=. --follow
